name: Toàn Trung CRM — CI Build, Architecture & Tests

on:
  push:
    branches:
      - main
      - feat/gumloop-ui-redesign
      - refactor/five-visible-modules
  pull_request:
    branches:
      - main
      - feat/gumloop-ui-redesign
      - refactor/five-visible-modules
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Verify Architecture, Tests, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma Client
        run: node scripts/predev.mjs

      - name: Check 5-Module Architecture & Boundaries
        run: node scripts/check-architecture.mjs

      - name: Typecheck Frontend & Backend
        run: |
          ./node_modules/.bin/tsc -p frontend/tsconfig.json --noEmit
          ./node_modules/.bin/tsc -p backend/tsconfig.json --noEmit

      - name: Run Module & Integration Tests (Isolated Test DB)
        run: node scripts/run-tests.mjs

      - name: Build Full-Stack Application (DB + API + Web)
        run: npm run build
