<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284C7"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <style>
      .title { font-size: 40px; font-weight: 800; fill: #0F172A; }
      .sub { font-size: 22px; fill: #475569; }
      .mname { font-size: 30px; font-weight: 800; }
      .mdesc { font-size: 23px; fill: #0F172A; }
      .mteam { font-size: 19px; fill: #475569; }
      .lbl { font-size: 23px; font-weight: 700; paint-order: stroke; stroke: #FFFFFF; stroke-width: 9px; stroke-linejoin: round; }
      .lbl2 { font-size: 20px; font-weight: 600; paint-order: stroke; stroke: #FFFFFF; stroke-width: 9px; stroke-linejoin: round; }
      .legend { font-size: 21px; fill: #0F172A; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1100" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="900" y="58" text-anchor="middle" class="title">MỐI LIÊN KẾT 5 MODULE – TOÀN TRUNG CRM</text>
  <text x="900" y="92" text-anchor="middle" class="sub">M02 là cửa vào · M01 là trung tâm · M04 là cửa ra · Cả 5 module dùng chung danh mục dòng LED</text>

  <!-- ===== ARROWS (drawn first, boxes on top) ===== -->

  <!-- (6) gray dashed: data to M04 -->
  <path d="M330,570 L330,900 L722,900" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#aGray)"/>
  <path d="M1470,570 L1470,900 L1078,900" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#aGray)"/>
  <path d="M900,570 L900,796" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#aGray)"/>
  <path d="M730,160 L650,160 L650,840 L722,840" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#aGray)"/>

  <!-- (5) M02 -> M03 cost -->
  <path d="M200,570 L200,690 L1630,690 L1630,576" fill="none" stroke="#0284C7" stroke-width="5" marker-end="url(#aTeal)"/>

  <!-- (1) M02 -> M01 -->
  <path d="M400,495 L724,495" fill="none" stroke="#0284C7" stroke-width="5" marker-end="url(#aTeal)"/>

  <!-- (4) M01 -> M03 -->
  <path d="M1070,495 L1394,495" fill="none" stroke="#1D4ED8" stroke-width="5" marker-end="url(#aBlue)"/>

  <!-- (2) M01 -> M05 (up) -->
  <path d="M860,420 L860,266" fill="none" stroke="#1D4ED8" stroke-width="5" marker-end="url(#aBlue)"/>

  <!-- (3) M05 -> M01 (down) -->
  <path d="M940,260 L940,414" fill="none" stroke="#6D28D9" stroke-width="5" marker-end="url(#aPurple)"/>

  <!-- ===== BOXES ===== -->

  <!-- M05 -->
  <rect x="730" y="110" width="340" height="150" rx="18" fill="#EDE9FE" stroke="#6D28D9" stroke-width="4"/>
  <text x="900" y="158" text-anchor="middle" class="mname" fill="#5B21B6">M05 – AI DESIGN</text>
  <text x="900" y="196" text-anchor="middle" class="mdesc">Phối cảnh LED đúng tỉ lệ</text>
  <text x="900" y="232" text-anchor="middle" class="mteam">Nhóm 5</text>

  <!-- M02 -->
  <rect x="60" y="420" width="340" height="150" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="4"/>
  <text x="230" y="468" text-anchor="middle" class="mname" fill="#0369A1">M02 – TRACKING</text>
  <text x="230" y="506" text-anchor="middle" class="mdesc">Khách đến từ đâu</text>
  <text x="230" y="542" text-anchor="middle" class="mteam">Nhóm 2 · CỬA VÀO</text>

  <!-- M01 -->
  <rect x="730" y="420" width="340" height="150" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="6"/>
  <text x="900" y="468" text-anchor="middle" class="mname" fill="#1E40AF">M01 – LEAD</text>
  <text x="900" y="506" text-anchor="middle" class="mdesc">Khách là ai, ai phụ trách</text>
  <text x="900" y="542" text-anchor="middle" class="mteam">Nhóm 1 · TRUNG TÂM</text>

  <!-- M03 -->
  <rect x="1400" y="420" width="340" height="150" rx="18" fill="#FFEDD5" stroke="#C2410C" stroke-width="4"/>
  <text x="1570" y="468" text-anchor="middle" class="mname" fill="#9A3412">M03 – ADS</text>
  <text x="1570" y="506" text-anchor="middle" class="mdesc">Quảng cáo có lời không</text>
  <text x="1570" y="542" text-anchor="middle" class="mteam">Nhóm 3</text>

  <!-- M04 -->
  <rect x="730" y="800" width="340" height="150" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="4"/>
  <text x="900" y="848" text-anchor="middle" class="mname" fill="#166534">M04 – BÁO CÁO</text>
  <text x="900" y="886" text-anchor="middle" class="mdesc">Kết quả kinh doanh ra sao</text>
  <text x="900" y="922" text-anchor="middle" class="mteam">Nhóm 4 · CỬA RA</text>

  <!-- ===== LABELS ===== -->
  <text x="520" y="452" text-anchor="middle" class="lbl" fill="#0369A1">① Lead + nguồn</text>
  <text x="520" y="480" text-anchor="middle" class="lbl2" fill="#0369A1">chiến dịch, từ khóa</text>

  <text x="1235" y="452" text-anchor="middle" class="lbl" fill="#1E40AF">④ Lead đạt chuẩn</text>
  <text x="1235" y="480" text-anchor="middle" class="lbl2" fill="#1E40AF">đơn chốt, doanh thu</text>

  <text x="845" y="332" text-anchor="end" class="lbl" fill="#1E40AF">② Yêu cầu thiết kế</text>
  <text x="845" y="360" text-anchor="end" class="lbl2" fill="#1E40AF">dòng LED, kích thước, ảnh khảo sát</text>

  <text x="955" y="332" text-anchor="start" class="lbl" fill="#5B21B6">③ Ảnh phối cảnh</text>
  <text x="955" y="360" text-anchor="start" class="lbl2" fill="#5B21B6">phương án khách chọn</text>

  <text x="1185" y="678" text-anchor="middle" class="lbl" fill="#0369A1">⑤ Chi phí quảng cáo: click, hiển thị, từ khóa</text>

  <text x="915" y="760" text-anchor="start" class="lbl" fill="#475569">⑥ Số liệu từ cả 4 module</text>

  <!-- ===== LEGEND ===== -->
  <rect x="60" y="985" width="1680" height="90" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="90" y1="1015" x2="150" y2="1015" stroke="#1D4ED8" stroke-width="5"/>
  <text x="165" y="1022" class="legend">Mũi tên liền màu: dữ liệu nghiệp vụ chính (① → ⑤)</text>
  <line x1="90" y1="1052" x2="150" y2="1052" stroke="#64748B" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="165" y="1059" class="legend">Mũi tên nét đứt xám: số liệu gửi về báo cáo (⑥)</text>
  <text x="1000" y="1022" class="legend">① M02 → M01   ② M01 → M05   ③ M05 → M01</text>
  <text x="1000" y="1059" class="legend">④ M01 → M03   ⑤ M02 → M03   ⑥ Tất cả → M04</text>
</svg>
